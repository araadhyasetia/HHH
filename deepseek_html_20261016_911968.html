const fmt = (n, d = 0) => Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });

const genSparkline = (base, variance, points = 12, trend = 0) => {
  const data = [];
  let val = base;
  for (let i = 0; i < points; i++) {
    val += (Math.random() - 0.5) * variance + trend;
    data.push({ i, v: Math.max(0, val) });
  }
  return data;
};

const severityColor = (s, theme) => {
  const map = {
    critical: theme === 'dark' ? 'text-red-400 bg-red-500/15 border-red-500/30' : 'text-red-700 bg-red-100 border-red-300',
    high: theme === 'dark' ? 'text-orange-400 bg-orange-500/15 border-orange-500/30' : 'text-orange-700 bg-orange-100 border-orange-300',
    medium: theme === 'dark' ? 'text-amber-400 bg-amber-500/15 border-amber-500/30' : 'text-amber-700 bg-amber-100 border-amber-300',
    low: theme === 'dark' ? 'text-sky-400 bg-sky-500/15 border-sky-500/30' : 'text-sky-700 bg-sky-100 border-sky-300',
    info: theme === 'dark' ? 'text-cyan-400 bg-cyan-500/15 border-cyan-500/30' : 'text-cyan-700 bg-cyan-100 border-cyan-300',
  };
  return map[s] || map.info;
};

const aqiColor = (aqi) => aqi <= 50 ? '#22c55e' : aqi <= 100 ? '#eab308' : aqi <= 150 ? '#f97316' : aqi <= 200 ? '#ef4444' : aqi <= 300 ? '#a855f7' : '#7f1d1d';

const statusColor = (status, theme) => {
  const map = {
    submitted: theme === 'dark' ? 'text-sky-400 bg-sky-500/15 border-sky-500/30' : 'text-sky-700 bg-sky-100 border-sky-300',
    'in-review': theme === 'dark' ? 'text-amber-400 bg-amber-500/15 border-amber-500/30' : 'text-amber-700 bg-amber-100 border-amber-300',
    assigned: theme === 'dark' ? 'text-violet-400 bg-violet-500/15 border-violet-500/30' : 'text-violet-700 bg-violet-100 border-violet-300',
    'in-progress': theme === 'dark' ? 'text-cyan-400 bg-cyan-500/15 border-cyan-500/30' : 'text-cyan-700 bg-cyan-100 border-cyan-300',
    resolved: theme === 'dark' ? 'text-emerald-400 bg-emerald-500/15 border-emerald-500/30' : 'text-emerald-700 bg-emerald-100 border-emerald-300',
    closed: theme === 'dark' ? 'text-slate-400 bg-slate-500/15 border-slate-500/30' : 'text-slate-700 bg-slate-100 border-slate-300',
  };
  return map[status] || map.submitted;
};

const genId = (prefix = 'NC') => {
  const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
  const num = String(Math.floor(Math.random() * 9000) + 1000);
  return prefix + '-' + num + '-' + rand;
};

const AppProvider = ({ children }) => {
  const [theme, setTheme] = useState('dark');
  const [route, setRoute] = useState('dashboard');
  const [selectedDistrict, setSelectedDistrict] = useState('Midtown Core');
  const [complaints, setComplaints] = useState(SAMPLE_COMPLAINTS);
  const [notifications, setNotifications] = useState(SAMPLE_NOTIFICATIONS);
  const [thresholds, setThresholds] = useState({ aqi: 150, traffic: 85, water: 50, power: 1000, riskScore: 70 });
  const [toasts, setToasts] = useState([]);

  useEffect(() => {
    try {
      const s1 = localStorage.getItem('nexus_complaints'); if (s1) setComplaints(JSON.parse(s1));
      const s2 = localStorage.getItem('nexus_notifications'); if (s2) setNotifications(JSON.parse(s2));
      const s3 = localStorage.getItem('nexus_thresholds'); if (s3) setThresholds(JSON.parse(s3));
      const s4 = localStorage.getItem('nexus_theme'); if (s4) setTheme(s4);
    } catch (e) {}
  }, []);

  useEffect(() => { try { localStorage.setItem('nexus_complaints', JSON.stringify(complaints)); } catch (e) {} }, [complaints]);
  useEffect(() => { try { localStorage.setItem('nexus_notifications', JSON.stringify(notifications)); } catch (e) {} }, [notifications]);
  useEffect(() => { try { localStorage.setItem('nexus_thresholds', JSON.stringify(thresholds)); } catch (e) {} }, [thresholds]);
  useEffect(() => { try { localStorage.setItem('nexus_theme', theme); } catch (e) {} }, [theme]);

  const toggleTheme = useCallback(() => setTheme(t => t === 'dark' ? 'light' : 'dark'), []);
  const addComplaint = useCallback((c) => setComplaints(prev => [c].concat(prev)), []);
  const updateComplaint = useCallback((id, patch) => {
    setComplaints(prev => prev.map(c => c.id === id ? Object.assign({}, c, patch, { updatedAt: new Date().toISOString() }) : c));
  }, []);
  const markRead = useCallback((id) => setNotifications(prev => prev.map(n => n.id === id ? Object.assign({}, n, { read: true }) : n)), []);
  const markAllRead = useCallback(() => setNotifications(prev => prev.map(n => Object.assign({}, n, { read: true }))), []);
  const dismissNotification = useCallback((id) => setNotifications(prev => prev.filter(n => n.id !== id)), []);
  const pushToast = useCallback((t) => {
    const id = Math.random().toString(36).substring(2, 9);
    setToasts(prev => prev.concat(Object.assign({}, t, { id })));
    setTimeout(() => setToasts(prev => prev.filter(x => x.id !== id)), 5000);
  }, []);
  const removeToast = useCallback((id) => setToasts(prev => prev.filter(x => x.id !== id)), []);

  const value = {
    theme, toggleTheme, route, setRoute, selectedDistrict, setSelectedDistrict,
    complaints, addComplaint, updateComplaint,
    notifications, markRead, markAllRead, dismissNotification,
    thresholds, setThresholds, toasts, pushToast, removeToast,
  };
  return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
};

const Modal = ({ open, onClose, title, children, footer, size = 'md' }) => {
  const { theme } = useApp();
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    if (open) window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  const widths = { sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-4xl' };
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
      <div className="absolute inset-0 bg-black/60" style={{ backdropFilter: 'blur(4px)' }} onClick={onClose} />
      <div className={"relative w-full " + widths[size] + " rounded-2xl border shadow-2xl " + (theme === 'dark' ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200')}>
        <div className={"flex items-center justify-between border-b px-5 py-3.5 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
          <h3 className={"text-sm font-semibold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>{title}</h3>
          <button onClick={onClose} className={"rounded-lg p-1.5 transition-colors " + (theme === 'dark' ? 'hover:bg-slate-800 text-slate-400' : 'hover:bg-slate-100 text-slate-600')} aria-label="Close">
            <Icon name="x" size={16} />
          </button>
        </div>
        <div className="max-h-[70vh] overflow-y-auto p-5">{children}</div>
        {footer && <div className={"flex justify-end gap-2 border-t px-5 py-3.5 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>{footer}</div>}

  );
};

const Sparkline = ({ data, color }) => {
  const id = 'spark' + Math.random().toString(36).substring(2, 8);
  return (
    <Recharts.ResponsiveContainer width="100%" height={32}>
      <Recharts.AreaChart data={data} margin={{ top: 2, right: 0, left: 0, bottom: 0 }}>
        <defs>
          <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">

const CircularProgress = ({ value, size = 140, stroke = 12, color = '#06b6d4', label }) => {
  const { theme } = useApp();
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (value / 100) * c;
  return (
    <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size / 2} cy={size / 2} r={r} stroke={theme === 'dark' ? '#1e293b' : '#e2e8f0'} strokeWidth={stroke} fill="none" />
        <circle cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={stroke} fill="none" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={offset} style={{ transition: 'stroke-dashoffset 0.8s ease' }} />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <span className={"text-2xl font-bold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>{value}</span>
        {label && <span className={"text-xs " + (theme === 'dark' ? 'text-slate-400' : 'text-slate-500')}>{label}</span>}
      </div>
    </div>
  );
};

const DistrictTable = () => {
  const { theme, setSelectedDistrict, setRoute } = useApp();
  const [sortKey, setSortKey] = useState('riskScore');
  const [sortDir, setSortDir] = useState('desc');
  const [filter, setFilter] = useState('');

  const filtered = useMemo(() => {
    let d = DISTRICTS.filter(x => x.name.toLowerCase().indexOf(filter.toLowerCase()) !== -1);
    d = d.slice().sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === 'number' && typeof bv === 'number') return sortDir === 'asc' ? av - bv : bv - av;
      return sortDir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
    });
    return d;
  }, [sortKey, sortDir, filter]);

  const cols = [
    { key: 'name', label: 'District' }, { key: 'aqi', label: 'AQI' }, { key: 'traffic', label: 'Traffic %' },
    { key: 'water', label: 'Water %' }, { key: 'power', label: 'Power MW' }, { key: 'waste', label: 'Waste %' }, { key: 'riskScore', label: 'Risk' },
  ];

  return (
    <div>
      <div className={"flex items-center gap-2 border-b px-4 py-2 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
        <span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-400'}><Icon name="search" size={12} /></span>
        <input value={filter} onChange={e => setFilter(e.target.value)} placeholder="Filter districts…" className={"w-48 bg-transparent text-xs focus:outline-none " + (theme === 'dark' ? 'text-slate-200 placeholder-slate-500' : 'text-slate-800 placeholder-slate-400')} />
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-xs">
          <thead>
            <tr className={"border-b " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
              {cols.map(c => (
                <th key={c.key} className={"px-4 py-2 text-left font-medium " + (theme === 'dark' ? 'text-slate-400' : 'text-slate-500')}>
                  <button onClick={() => { setSortKey(c.key); setSortDir(sortKey === c.key && sortDir === 'desc' ? 'asc' : 'desc'); }} className="inline-flex items-center gap-1 hover:text-cyan-400">
                    {c.label}
                    {sortKey === c.key && <Icon name={sortDir === 'asc' ? 'chevronUp' : 'chevronDown'} size={10} />}
                  </button>
                </th>
              ))}
              <th className={"px-4 py-2 text-right font-medium " + (theme === 'dark' ? 'text-slate-400' : 'text-slate-500')}>Action</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(d => (
              <tr key={d.id} className={"border-b " + (theme === 'dark' ? 'border-slate-800/60' : 'border-slate-100')}>
                <td className={"px-4 py-2 font-medium " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>{d.name}</td>
                <td className="px-4 py-2"><span style={{ color: aqiColor(d.aqi) }}>{d.aqi}</span></td>
                <td className={"px-4 py-2 " + (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')}>{d.traffic}%</td>
                <td className={"px-4 py-2 " + (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')}>{d.water}%</td>
                <td className={"px-4 py-2 " + (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')}>{fmt(d.power)}</td>
                <td className={"px-4 py-2 " + (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')}>{d.waste}%</td>
                <td className="px-4 py-2">
                  <Badge className={severityColor(d.riskScore > 70 ? 'critical' : d.riskScore > 50 ? 'high' : d.riskScore > 30 ? 'medium' : 'low', theme)}>{d.riskScore}</Badge>
                </td>
                <td className="px-4 py-2 text-right">
                  <Button size="sm" variant="ghost" onClick={() => { setSelectedDistrict(d.name); setRoute('dashboard'); }}>
                    <Icon name="eye" size={12} /> View
                  </Button>
                </td>
              </tr>
            ))}
          </tbody>

const RISK_RULES = {
  flood: { name: 'Flood Risk' },
  heatwave: { name: 'Heatwave Risk' },
  air: { name: 'Air Pollution Risk' },
  water: { name: 'Water Shortage Risk' },
  weather: { name: 'Severe Weather Risk' },
};

const RangeInput = ({ label, value, min, max, onChange }) => {
  const { theme } = useApp();
  return (
    <div>
      <div className="flex items-center justify-between">
        <label className={"text-xs font-medium " + (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')}>{label}</label>
        <span className={"text-xs font-semibold " + (theme === 'dark' ? 'text-cyan-400' : 'text-cyan-600')}>{value}</span>
      </div>
      <input type="range" min={min} max={max} value={value} onChange={e => onChange(Number(e.target.value))} className="mt-1 w-full" aria-label={label} />
    </div>
  );
};

const RiskAnalyzerPage = () => {
  const { theme, selectedDistrict, pushToast } = useApp();
  const [hazard, setHazard] = useState('flood');
  const [district, setDistrict] = useState(selectedDistrict);
  const [inputs, setInputs] = useState({ rainfall: 85, temperature: 34, aqi: 140, waterLevel: 72, windSpeed: 45, humidity: 78, reservoir: 55, drainage: 60, duration: 5, pressure: 1002, pm25: 90, consumption: 80, leakage: 20, vulnerability: 65, elevation: 40 });
  const [result, setResult] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);

  const d = DISTRICTS.find(x => x.name === district) || DISTRICTS[0];

  const runAnalysis = () => {
    setAnalyzing(true);
    setTimeout(() => {
      let score = 0;
      const factors = [];
      const add = (name, value, weight, max) => {
        max = max || 100;
        const norm = Math.min(100, (value / max) * 100);
        const contribution = norm * weight;
        score += contribution;
        factors.push({ name: name, contribution: Math.round(contribution), value: value });
      };

      if (hazard === 'flood') {
        add('Rainfall intensity', inputs.rainfall, 0.4);
        add('Water level', inputs.waterLevel, 0.25);
        add('Drainage capacity (inverse)', 100 - inputs.drainage, 0.2);
        add('Low elevation factor', 100 - inputs.elevation, 0.15);
      } else if (hazard === 'heatwave') {
        add('Temperature', inputs.temperature, 0.45, 50);
        add('Humidity', inputs.humidity, 0.2);
        add('Vulnerable population', inputs.vulnerability, 0.2);
        add('Duration (days)', inputs.duration, 0.15, 14);
      } else if (hazard === 'air') {
        add('AQI', inputs.aqi, 0.4, 300);
        add('PM2.5', inputs.pm25, 0.3, 250);
        add('Low wind dispersion', 100 - inputs.windSpeed, 0.15);
        add('Population density', d.population / 2500, 0.15);
      } else if (hazard === 'water') {
        add('Low reservoir level', 100 - inputs.reservoir, 0.4);
        add('High consumption', inputs.consumption, 0.25);
        add('Low rainfall', 100 - inputs.rainfall, 0.2);
        add('Leakage losses', inputs.leakage, 0.15);
      } else {
        add('Wind speed', inputs.windSpeed, 0.35, 120);
        add('Low pressure anomaly', Math.abs(inputs.pressure - 1013), 0.3, 40);
        add('Rainfall', inputs.rainfall, 0.2);
        add('Temperature extreme', Math.abs(inputs.temperature - 22), 0.15, 25);
      }

      const finalScore = Math.round(Math.min(100, score));
      const category = finalScore >= 80 ? 'Critical' : finalScore >= 60 ? 'High' : finalScore >= 40 ? 'Moderate' : finalScore >= 20 ? 'Low' : 'Minimal';
      const actions = {
        Critical: ['Activate emergency operations center', 'Issue public evacuation advisory for at-risk zones', 'Pre-position emergency supplies and personnel', 'Coordinate with regional authorities'],
        High: ['Issue public advisory', 'Deploy additional monitoring', 'Pre-stage response teams', 'Notify vulnerable populations'],
        Moderate: ['Increase monitoring frequency', 'Review response plans', 'Prepare public communication'],
        Low: ['Maintain standard monitoring', 'Review seasonal preparedness'],
        Minimal: ['Continue routine monitoring'],
      };

      setResult({ score: finalScore, category: category, factors: factors, actions: actions[category] || actions.Low });
      setAnalyzing(false);
      pushToast({ title: 'Analysis complete', message: RISK_RULES[hazard].name + ' for ' + district + ': ' + finalScore + '/100 (' + category + ')', severity: finalScore >= 60 ? 'high' : 'info' });
    }, 800);
  };

  useEffect(() => { setResult(null); }, [hazard, district]);

  const catColor = (c) => c === 'Critical' ? '#ef4444' : c === 'High' ? '#f97316' : c === 'Moderate' ? '#eab308' : c === 'Low' ? '#22c55e' : '#06b6d4';

  return (
    <div className="space-y-4 p-4 md:p-6">
      <div>
        <Breadcrumbs />
        <h1 className={"mt-1 text-xl font-bold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>AI Disaster Risk Analyzer</h1>
        <p className={"text-xs " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')}>Transparent demonstration rules — not a validated forecasting model</p>
      </div>

      <div className={"rounded-xl border p-3 " + (theme === 'dark' ? 'border-amber-500/30 bg-amber-500/5' : 'border-amber-300 bg-amber-50')}>
        <div className="flex items-start gap-2">
          <span className="text-amber-400" style={{ marginTop: 2 }}><Icon name="alertTriangle" size={14} /></span>
          <p className={"text-xs " + (theme === 'dark' ? 'text-amber-200' : 'text-amber-800')}>
            <strong>Disclaimer:</strong> This analyzer uses illustrative, fully transparent scoring rules for demonstration. It is not a scientifically validated forecast and must not be used for real emergency decisions.
          </p>
        </div>
      </div>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <Card className="lg:col-span-2 p-4">
          <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <Select label="District" value={district} onChange={e => setDistrict(e.target.value)}>
              {DISTRICTS.map(dd => <option key={dd.id} value={dd.name}>{dd.name}</option>)}
            </Select>
            <Select label="Hazard Type" value={hazard} onChange={e => setHazard(e.target.value)}>
              {Object.keys(RISK_RULES).map(k => <option key={k} value={k}>{RISK_RULES[k].name}</option>)}
            </Select>
          </div>

          <div className="mt-4">
            <p className={"mb-2 text-xs font-semibold " + (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')}>Input Parameters</p>
            <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
              {hazard === 'flood' && <React.Fragment>
                <RangeInput label="Rainfall (mm)" value={inputs.rainfall} min={0} max={200} onChange={v => setInputs(p => Object.assign({}, p, { rainfall: v }))} />
                <RangeInput label="Water Level (%)" value={inputs.waterLevel} min={0} max={100} onChange={v => setInputs(p => Object.assign({}, p, { waterLevel: v }))} />
                <RangeInput label="Drainage Capacity (%)" value={inputs.drainage} min={0} max={100} onChange={v => setInputs(p => Object.assign({}, p, { drainage: v }))} />
                <RangeInput label="Elevation (m)" value={inputs.elevation} min={0} max={100} onChange={v => setInputs(p => Object.assign({}, p, { elevation: v }))} />
              </React.Fragment>}
              {hazard === 'heatwave' && <React.Fragment>
                <RangeInput label="Temperature (°C)" value={inputs.temperature} min={20} max={50} onChange={v => setInputs(p => Object.assign({}, p, { temperature: v }))} />
                <RangeInput label="Humidity (%)" value={inputs.humidity} min={0} max={100} onChange={v => setInputs(p => Object.assign({}, p, { humidity: v }))} />
                <RangeInput label="Vulnerable Population (%)" value={inputs.vulnerability} min={0} max={100} onChange={v => setInputs(p => Object.assign({}, p, { vulnerability: v }))} />
                <RangeInput label="Duration (days)" value={inputs.duration} min={1} max={14} onChange={v => setInputs(p => Object.assign({}, p, { duration: v }))} />
              </React.Fragment>}
              {hazard === 'air' && <React.Fragment>
                <RangeInput label="AQI" value={inputs.aqi} min={0} max={300} onChange={v => setInputs(p => Object.assign({}, p, { aqi: v }))} />
                <RangeInput label="PM2.5 (µg/m³)" value={inputs.pm25} min={0} max={250} onChange={v => setInputs(p => Object.assign({}, p, { pm25: v }))} />
                <RangeInput label="Wind Speed (km/h)" value={inputs.windSpeed} min={0} max={120} onChange={v => setInputs(p => Object.assign({}, p, { windSpeed: v }))} />
              </React.Fragment>}
              {hazard === 'water' && <React.Fragment>
                <RangeInput label="Reservoir Level (%)" value={inputs.reservoir} min={0} max={100} onChange={v => setInputs(p => Object.assign({}, p, { reservoir: v }))} />
                <RangeInput label="Consumption Index (%)" value={inputs.consumption} min={0} max={100} onChange={v => setInputs(p => Object.assign({}, p, { consumption: v }))} />
                <RangeInput label="Rainfall (mm)" value={inputs.rainfall} min={0} max={200} onChange={v => setInputs(p => Object.assign({}, p, { rainfall: v }))} />
                <RangeInput label="Leakage Losses (%)" value={inputs.leakage} min={0} max={60} onChange={v => setInputs(p => Object.assign({}, p, { leakage: v }))} />
              </React.Fragment>}
              {hazard === 'weather' && <React.Fragment>
                <RangeInput label="Wind Speed (km/h)" value={inputs.windSpeed} min={0} max={120} onChange={v => setInputs(p => Object.assign({}, p, { windSpeed: v }))} />
                <RangeInput label="Pressure (hPa)" value={inputs.pressure} min={970} max={1040} onChange={v => setInputs(p => Object.assign({}, p, { pressure: v }))} />
                <RangeInput label="Rainfall (mm)" value={inputs.rainfall} min={0} max={200} onChange={v => setInputs(p => Object.assign({}, p, { rainfall: v }))} />
                <RangeInput label="Temperature (°C)" value={inputs.temperature} min={0} max={50} onChange={v => setInputs(p => Object.assign({}, p, { temperature: v }))} />

              {result.factors.map((f, i) => (

                    <span className={"text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>{f.contribution} pts</span>

                  <div className={"mt-1 h-1.5 w-full rounded-full " + (theme === 'dark' ? 'bg-slate-800' : 'bg-slate-200')}>
                    <div className="h-1.5 rounded-full" style={{ width: Math.min(100, f.contribution * 2) + '%', background: catColor(result.category), transition: 'width 0.5s' }} />

                  <p className={"mt-0.5 " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')} style={{ fontSize: 10 }}>Input value: {f.value}</p>

          <Card className="p-4">
            <p className={"mb-3 text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Recommended Actions</p>

};

const TrafficPage = () => {
  const { theme, pushToast } = useApp();
  const [period, setPeriod] = useState('24h');
  const [origin, setOrigin] = useState('Harborview');
  const [dest, setDest] = useState('Midtown Core');
  const [routeResult, setRouteResult] = useState(null);
  const [computing, setComputing] = useState(false);

  const trafficData = useMemo(() => {
    const arr = [];
    for (let i = 0; i < 24; i++) {
      arr.push({
        time: (i < 10 ? '0' : '') + i + ':00',
        volume: Math.round(800 + Math.sin(i / 3) * 400 + Math.random() * 200),
        congestion: Math.round(45 + Math.sin(i / 4) * 30 + Math.random() * 15),
      });
    }
    return arr;
  }, []);

  const computeRoute = () => {
    setComputing(true);
    setTimeout(() => {
      const d1 = DISTRICTS.find(x => x.name === origin);
      const d2 = DISTRICTS.find(x => x.name === dest);
      const base = Math.abs(DISTRICTS.indexOf(d1) - DISTRICTS.indexOf(d2));
      const distance = 3 + base * 2.4;
      const congestion = Math.round((d1.traffic + d2.traffic) / 2);
      const time = Math.round(distance * (1 + congestion / 100) * 3.5);
      const altDistance = distance * 1.28;
      const altCongestion = Math.max(15, congestion - 28);
      const altTime = Math.round(altDistance * (1 + altCongestion / 100) * 3.5);
      setRouteResult({ distance: distance, time: time, congestion: congestion, alt: { distance: altDistance, time: altTime, congestion: altCongestion } });
      setComputing(false);
      pushToast({ title: 'Route computed', message: origin + ' → ' + dest + ': ' + time + ' min (simulated)', severity: 'info' });
    }, 700);
  };

  return (
    <div className="space-y-4 p-4 md:p-6">
      <div>
        <Breadcrumbs />
        <h1 className={"mt-1 text-xl font-bold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>Traffic Intelligence</h1>
        <p className={"text-xs " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')}>Simulated traffic data · illustrative route comparisons</p>
      </div>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-3">
        <Card className="lg:col-span-2 p-4">
          <div className="flex items-center justify-between">
            <span className={"text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Traffic Volume & Congestion</span>
            <select value={period} onChange={e => setPeriod(e.target.value)} className={"rounded-lg border px-2 py-1 " + (theme === 'dark' ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700')} style={{ fontSize: 11 }}>
              <option value="24h">Last 24h</option>
              <option value="7d">Last 7 days</option>
            </select>
          </div>
          <div style={{ height: 240, marginTop: 12 }}>
            <Recharts.ResponsiveContainer width="100%" height="100%">
              <Recharts.BarChart data={trafficData} margin={{ top: 5, right: 5, left: -20, bottom: 0 }}>
                <Recharts.CartesianGrid strokeDasharray="3 3" stroke={theme === 'dark' ? '#1e293b' : '#e2e8f0'} vertical={false} />
                <Recharts.XAxis dataKey="time" tick={{ fill: '#64748b', fontSize: 10 }} axisLine={false} tickLine={false} interval={3} />
                <Recharts.YAxis tick={{ fill: '#64748b', fontSize: 10 }} axisLine={false} tickLine={false} />
                <Recharts.Tooltip contentStyle={{ background: theme === 'dark' ? '#0f172a' : '#fff', border: '1px solid ' + (theme === 'dark' ? '#334155' : '#e2e8f0'), borderRadius: 8, fontSize: 12 }} />
                <Recharts.Bar dataKey="volume" fill="#06b6d4" radius={[3, 3, 0, 0]} name="Vehicles/hr" />
              </Recharts.BarChart>
            </Recharts.ResponsiveContainer>
          </div>
        </Card>

        <Card className="p-4">
          <p className={"text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Route Comparison</p>
          <div className="mt-3 space-y-3">
            <Select label="Origin" value={origin} onChange={e => setOrigin(e.target.value)}>
              {DISTRICTS.map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
            </Select>
            <Select label="Destination" value={dest} onChange={e => setDest(e.target.value)}>
              {DISTRICTS.map(d => <option key={d.id} value={d.name}>{d.name}</option>)}
            </Select>
            <Button onClick={computeRoute} disabled={computing || origin === dest} className="w-full">
              {computing ? <Icon name="refresh" size={14} className="animate-spin" /> : <Icon name="route" size={14} />}
              {computing ? 'Computing…' : 'Compare Routes'}
            </Button>
          </div>
          {routeResult && (
            <div className="mt-4 space-y-2">
              <div className={"rounded-lg border p-2.5 " + (theme === 'dark' ? 'border-cyan-500/30 bg-cyan-500/5' : 'border-cyan-200 bg-cyan-50')}>
                <p className={"font-semibold uppercase tracking-wider " + (theme === 'dark' ? 'text-cyan-400' : 'text-cyan-700')} style={{ fontSize: 10 }}>Fastest Route</p>
                <div className="mt-1 flex justify-between text-xs">
                  <span className={theme === 'dark' ? 'text-slate-300' : 'text-slate-700'}>{routeResult.distance.toFixed(1)} km</span>
                  <span className={"font-semibold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>{routeResult.time} min</span>
                </div>
                <div className={"mt-1 " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')} style={{ fontSize: 10 }}>Congestion: {routeResult.congestion}%</div>
              </div>
              <div className={"rounded-lg border p-2.5 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
                <p className={"font-semibold uppercase tracking-wider " + (theme === 'dark' ? 'text-slate-400' : 'text-slate-600')} style={{ fontSize: 10 }}>Alternative</p>
                <div className="mt-1 flex justify-between text-xs">
                  <span className={theme === 'dark' ? 'text-slate-300' : 'text-slate-700'}>{routeResult.alt.distance.toFixed(1)} km</span>
                  <span className={"font-semibold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>{routeResult.alt.time} min</span>
                </div>
                <div className={"mt-1 " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')} style={{ fontSize: 10 }}>Congestion: {routeResult.alt.congestion}%</div>
              </div>
              <p className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'} style={{ fontSize: 10 }}>* Simulated values from fictional road network.</p>
            </div>
          )}
        </Card>
      </div>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <Card className="overflow-hidden">
          <div className={"border-b px-4 py-2.5 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
            <span className={"text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Congestion Heatmap</span>
          </div>
          <div className="grid grid-cols-4 gap-1 p-3">
            {DISTRICTS.map(d => (
              <div key={d.id} className="rounded-lg p-2 text-center" style={{ background: 'rgba(249,115,22,' + (d.traffic / 100 * 0.7) + ')' }}>
                <p className="font-semibold text-white" style={{ fontSize: 10 }}>{d.name.split(' ')[0]}</p>
                <p className="text-xs font-bold text-white">{d.traffic}%</p>
              </div>
            ))}
          </div>
        </Card>

        <Card className="overflow-hidden">
          <div className={"flex items-center justify-between border-b px-4 py-2.5 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
            <span className={"text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Road Incidents</span>
            <Badge className={severityColor('high', theme)}>3 active</Badge>
          </div>
          <div className="p-2">
            {INCIDENTS.filter(i => i.type === 'traffic').map(i => (
              <div key={i.id} className={"mb-1.5 rounded-lg border p-2.5 " + (theme === 'dark' ? 'border-slate-800 bg-slate-900/40' : 'border-slate-200 bg-slate-50')}>
                <div className="flex items-start justify-between">
                  <p className={"text-xs font-medium " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>{i.title}</p>
                  <Badge className={severityColor(i.severity, theme)}>{i.severity}</Badge>
                </div>
                <div className="mt-1 flex items-center gap-2" style={{ fontSize: 10 }}>
                  <span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>{i.district}</span>
                  <span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>{i.time}</span>
                  <span className={"ml-auto " + (theme === 'dark' ? 'text-slate-400' : 'text-slate-600')}>{i.status}</span>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
};

const EnvironmentPage = () => {
  const { theme, selectedDistrict, pushToast } = useApp();
  const [dateRange, setDateRange] = useState({ from: '2024-06-05', to: '2024-06-12' });
  const [metrics, setMetrics] = useState({ aqi: true, pm25: true, pm10: false, temp: false, humidity: false });

  const district = DISTRICTS.find(d => d.name === selectedDistrict) || DISTRICTS[1];

  const data = useMemo(() => {
    const arr = [];
    for (let i = 0; i < 7; i++) {
      arr.push({
        date: 'Jun ' + (5 + i),
        aqi: Math.round(district.aqi + Math.sin(i) * 25 + Math.random() * 10),
        pm25: Math.round(district.aqi * 0.6 + Math.random() * 15),
        pm10: Math.round(district.aqi * 0.9 + Math.random() * 20),
        temp: Math.round(24 + Math.sin(i / 2) * 6 + Math.random() * 3),
        humidity: Math.round(65 + Math.cos(i) * 15 + Math.random() * 5),
      });
    }
    return arr;
  }, [district]);

  const downloadCSV = () => {
    const headers = ['Date', 'AQI', 'PM2.5', 'PM10', 'Temp (C)', 'Humidity (%)'];
    const rows = data.map(r => [r.date, r.aqi, r.pm25, r.pm10, r.temp, r.humidity]);
    const csv = [headers].concat(rows).map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nexus-environment-' + district.name + '-' + Date.now() + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    pushToast({ title: 'Report downloaded', message: 'CSV exported for ' + district.name, severity: 'info' });
  };

  const metricConfig = [
    { key: 'aqi', label: 'AQI' }, { key: 'pm25', label: 'PM2.5' }, { key: 'pm10', label: 'PM10' },
    { key: 'temp', label: 'Temp' }, { key: 'humidity', label: 'Humidity' },
  ];

  return (
    <div className="space-y-4 p-4 md:p-6">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div>
          <Breadcrumbs />
          <h1 className={"mt-1 text-xl font-bold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>Pollution & Environment Monitor</h1>
          <p className={"text-xs " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')}>Simulated sensor readings · {district.name}</p>
        </div>
        <Button variant="secondary" onClick={downloadCSV}>
          <Icon name="download" size={14} /> Download CSV
        </Button>
      </div>

      <div className="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5">
        {[
          { l: 'AQI', v: district.aqi, c: aqiColor(district.aqi), sub: aqiLabel(district.aqi) },
          { l: 'PM2.5', v: Math.round(district.aqi * 0.6), c: '#f97316', sub: 'µg/m³' },
          { l: 'PM10', v: Math.round(district.aqi * 0.9), c: '#a855f7', sub: 'µg/m³' },
          { l: 'Temp', v: Math.round(24 + district.riskScore / 10) + '°', c: '#ef4444', sub: 'Celsius' },
          { l: 'Humidity', v: Math.round(60 + district.water / 5) + '%', c: '#06b6d4', sub: 'Relative' },
        ].map(m => (
          <Card key={m.l} className="p-3">
            <p className={"uppercase tracking-wider " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')} style={{ fontSize: 10 }}>{m.l}</p>
            <p className="mt-1 text-xl font-bold" style={{ color: m.c }}>{m.v}</p>
            <p className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'} style={{ fontSize: 10 }}>{m.sub}</p>
          </Card>
        ))}
      </div>

      <Card className="p-4">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <span className={"text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Trend Analysis</span>
          <div className="flex flex-wrap items-center gap-2">
            <div className="flex flex-wrap gap-1">
              {metricConfig.map(m => (
                <button key={m.key} onClick={() => setMetrics(p => Object.assign({}, p, { [m.key]: !p[m.key] }))} className={"rounded-md border px-2 py-1 font-medium " + (metrics[m.key] ? (theme === 'dark' ? 'border-cyan-500/40 bg-cyan-500/10 text-cyan-400' : 'border-cyan-300 bg-cyan-50 text-cyan-700') : (theme === 'dark' ? 'border-slate-800 text-slate-500' : 'border-slate-200 text-slate-400'))} style={{ fontSize: 10 }}>{m.label}</button>
              ))}
            </div>
            <input type="date" value={dateRange.from} onChange={e => setDateRange(p => Object.assign({}, p, { from: e.target.value }))} className={"rounded-lg border px-2 py-1 " + (theme === 'dark' ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700')} style={{ fontSize: 11 }} aria-label="From date" />
            <input type="date" value={dateRange.to} onChange={e => setDateRange(p => Object.assign({}, p, { to: e.target.value }))} className={"rounded-lg border px-2 py-1 " + (theme === 'dark' ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700')} style={{ fontSize: 11 }} aria-label="To date" />
          </div>
        </div>
        <div style={{ height: 256, marginTop: 12 }}>
          <Recharts.ResponsiveContainer width="100%" height="100%">

              <Recharts.YAxis tick={{ fill: '#64748b', fontSize: 10 }} axisLine={false} tickLine={false} />
              <Recharts.Tooltip contentStyle={{ background: theme === 'dark' ? '#0f172a' : '#fff', border: '1px solid ' + (theme === 'dark' ? '#334155' : '#e2e8f0'), borderRadius: 8, fontSize: 12 }} />
              <Recharts.Legend wrapperStyle={{ fontSize: 11 }} />
              {metrics.aqi && <Recharts.Line type="monotone" dataKey="aqi" stroke={aqiColor(district.aqi)} strokeWidth={2} dot={{ r: 3 }} name="AQI" />}
              {metrics.pm25 && <Recharts.Line type="monotone" dataKey="pm25" stroke="#f97316" strokeWidth={2} dot={{ r: 3 }} name="PM2.5" />}
              {metrics.pm10 && <Recharts.Line type="monotone" dataKey="pm10" stroke="#a855f7" strokeWidth={2} dot={{ r: 3 }} name="PM10" />}
              {metrics.temp && <Recharts.Line type="monotone" dataKey="temp" stroke="#ef4444" strokeWidth={2} dot={{ r: 3 }} name="Temp" />}
              {metrics.humidity && <Recharts.Line type="monotone" dataKey="humidity" stroke="#06b6d4" strokeWidth={2} dot={{ r: 3 }} name="Humidity" />}
            </Recharts.LineChart>
          </Recharts.ResponsiveContainer>
        </div>
      </Card>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <Card className="p-4">
          <p className={"mb-3 text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>District Pollution Comparison</p>
          <div className="space-y-2">
            {DISTRICTS.slice().sort((a, b) => b.aqi - a.aqi).map(d => (
              <div key={d.id}>
                <div className="flex items-center justify-between">
                  <span className={"text-xs " + (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')}>{d.name}</span>
                  <span className="text-xs font-semibold" style={{ color: aqiColor(d.aqi) }}>{d.aqi}</span>
                </div>
                <div className={"mt-1 h-1.5 w-full rounded-full " + (theme === 'dark' ? 'bg-slate-800' : 'bg-slate-200')}>
                  <div className="h-1.5 rounded-full" style={{ width: (d.aqi / 300 * 100) + '%', background: aqiColor(d.aqi), transition: 'width 0.7s' }} />

              </div>

        </Card>

        <Card className="p-4">
          <p className={"mb-3 text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Environmental Threshold Alerts</p>

            {[
              { l: 'AQI > 150 (Unhealthy)', ok: district.aqi <= 150, v: district.aqi, t: 150 },
              { l: 'PM2.5 > 75 µg/m³', ok: district.aqi * 0.6 <= 75, v: Math.round(district.aqi * 0.6), t: 75 },

              <div key={a.l} className={"flex items-center justify-between rounded-lg border p-2.5 " + (a.ok ? (theme === 'dark' ? 'border-emerald-500/20 bg-emerald-500/5' : 'border-emerald-200 bg-emerald-50') : (theme === 'dark' ? 'border-red-500/30 bg-red-500/5' : 'border-red-200 bg-red-50'))}>

                  <span className={a.ok ? 'text-emerald-400' : 'text-red-400'}><Icon name={a.ok ? 'checkCircle' : 'xCircle'} size={14} /></span>

              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
};

const ComplaintsPage = () => {
  const { theme, complaints, addComplaint, pushToast, setRoute } = useApp();
  const [form, setForm] = useState({ title: '', category: 'Roads', district: 'Midtown Core', description: '', priority: 'medium', contact: '' });
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [submittedId, setSubmittedId] = useState(null);

  const validate = () => {
    const e = {};
    if (!form.title.trim()) e.title = 'Title is required';
    if (form.title.length > 100) e.title = 'Title must be under 100 characters';
    if (!form.description.trim()) e.description = 'Description is required';
    if (form.description.length < 10) e.description = 'Please provide at least 10 characters';
    if (form.contact && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.contact) && !/^[\d\s\-+()]{7,}$/.test(form.contact)) e.contact = 'Enter a valid email or phone';
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!validate()) return;
    setSubmitting(true);
    setTimeout(() => {
      const id = genId('NC');
      const newComplaint = {
        id: id, title: form.title.trim(), category: form.category, district: form.district,
        description: form.description.trim(), priority: form.priority, status: 'submitted',
        contact: form.contact || undefined,
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
      };
      addComplaint(newComplaint);
      setSubmittedId(id);
      setSubmitting(false);
      setForm({ title: '', category: 'Roads', district: 'Midtown Core', description: '', priority: 'medium', contact: '' });
      pushToast({ title: 'Complaint submitted', message: 'Reference ID: ' + id, severity: 'info' });
    }, 900);
  };

  const myComplaints = complaints.slice(0, 5);

  return (
    <div className="space-y-4 p-4 md:p-6">
      <div>
        <Breadcrumbs />
        <h1 className={"mt-1 text-xl font-bold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>Citizen Complaint Management</h1>
        <p className={"text-xs " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')}>Submit issues · track status · demo mode persists locally</p>
      </div>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <Card className="p-4">
          <p className={"mb-3 text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Submit a New Complaint</p>
          {submittedId && (
            <div className={"mb-3 flex items-center gap-2 rounded-lg border p-2.5 " + (theme === 'dark' ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-emerald-200 bg-emerald-50')}>
              <span className="text-emerald-400"><Icon name="checkCircle" size={14} /></span>
              <span className={"text-xs " + (theme === 'dark' ? 'text-emerald-300' : 'text-emerald-800')}>Complaint created: <strong>{submittedId}</strong></span>
            </div>
          )}
          <form onSubmit={handleSubmit} className="space-y-3">
            <Input label="Complaint Title *" value={form.title} onChange={e => setForm(f => Object.assign({}, f, { title: e.target.value }))} error={errors.title} placeholder="e.g. Overflowing bin on Main St" />
            <div className="grid grid-cols-2 gap-3">
              <Select label="Category" value={form.category} onChange={e => setForm(f => Object.assign({}, f, { category: e.target.value }))}>
                {['Roads', 'Waste', 'Water', 'Electricity', 'Environment', 'Traffic', 'Safety', 'Other'].map(c => <option key={c}>{c}</option>)}
              </Select>
              <Select label="District" value={form.district} onChange={e => setForm(f => Object.assign({}, f, { district: e.target.value }))}>
                {DISTRICTS.map(d => <option key={d.id}>{d.name}</option>)}
              </Select>
            </div>
            <Textarea label="Description *" rows={4} value={form.description} onChange={e => setForm(f => Object.assign({}, f, { description: e.target.value }))} error={errors.description} placeholder="Describe the issue, location, and any relevant details…" />
            <div className="grid grid-cols-2 gap-3">
              <Select label="Priority" value={form.priority} onChange={e => setForm(f => Object.assign({}, f, { priority: e.target.value }))}>
                <option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="critical">Critical</option>
              </Select>
              <Input label="Contact (optional)" value={form.contact} onChange={e => setForm(f => Object.assign({}, f, { contact: e.target.value }))} error={errors.contact} placeholder="email or phone" />
            </div>
            <div className="flex gap-2">
              <Button type="submit" disabled={submitting}>
                {submitting ? <Icon name="refresh" size={14} className="animate-spin" /> : <Icon name="send" size={14} />}
                {submitting ? 'Submitting…' : 'Submit Complaint'}
              </Button>
              <Button type="button" variant="secondary" onClick={() => { setForm({ title: '', category: 'Roads', district: 'Midtown Core', description: '', priority: 'medium', contact: '' }); setErrors({}); }}>Clear</Button>
            </div>
          </form>
        </Card>

        <Card className="overflow-hidden">
          <div className={"flex items-center justify-between border-b px-4 py-2.5 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
            <span className={"text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Recent Complaints</span>
            <Button size="sm" variant="ghost" onClick={() => setRoute('admin')}>Admin View <Icon name="arrowRight" size={12} /></Button>
          </div>
          <div className="overflow-y-auto p-2" style={{ maxHeight: 400 }}>
            {myComplaints.length === 0 ? (
              <EmptyState icon={<Icon name="message" size={20} />} title="No complaints yet" message="Submit your first complaint using the form." />
            ) : myComplaints.map(c => (
              <div key={c.id} className={"mb-1.5 rounded-lg border p-2.5 " + (theme === 'dark' ? 'border-slate-800 bg-slate-900/40' : 'border-slate-200 bg-slate-50')}>
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0 flex-1">
                    <p className={"truncate text-xs font-medium " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>{c.title}</p>
                    <p className={"mt-0.5 " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')} style={{ fontSize: 10 }}>{c.id} · {c.district} · {c.category}</p>
                  </div>
                  <div className="flex shrink-0 flex-col items-end gap-1">
                    <Badge className={statusColor(c.status, theme)}>{c.status}</Badge>
                    <Badge className={severityColor(c.priority, theme)}>{c.priority}</Badge>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
};

// ============================================================
// ADMIN PAGE
// ============================================================
const AdminPage = () => {
  const { theme, complaints, updateComplaint, pushToast } = useApp();
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [priorityFilter, setPriorityFilter] = useState('all');
  const [selected, setSelected] = useState(null);
  const [assignDept, setAssignDept] = useState('Sanitation Dept');
  const [resolution, setResolution] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [page, setPage] = useState(1);
  const perPage = 6;

  const filtered = useMemo(() => complaints.filter(c => {
    if (search && c.title.toLowerCase().indexOf(search.toLowerCase()) === -1 && c.id.toLowerCase().indexOf(search.toLowerCase()) === -1) return false;
    if (statusFilter !== 'all' && c.status !== statusFilter) return false;
    if (priorityFilter !== 'all' && c.priority !== priorityFilter) return false;
    return true;
  }), [complaints, search, statusFilter, priorityFilter]);

  const paged = filtered.slice((page - 1) * perPage, page * perPage);
  const totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
  const departments = ['Sanitation Dept', 'Water Authority', 'Power & Lighting', 'Roads & Transport', 'Environment Agency', 'Public Safety'];

  return (
    <div className="space-y-4 p-4 md:p-6">
      <div>
        <Breadcrumbs />
        <h1 className={"mt-1 text-xl font-bold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>Administrator Panel</h1>
        <p className={"text-xs " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')}>Manage complaints, assign departments, update statuses</p>
      </div>

      <Card className="overflow-hidden">
        <div className={"flex flex-wrap items-center gap-2 border-b p-3 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
          <div className="relative flex-1" style={{ minWidth: 180 }}>
            <span className={"absolute left-2.5 top-1/2 " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-400')} style={{ transform: 'translateY(-50%)' }}><Icon name="search" size={12} /></span>
            <input value={search} onChange={e => { setSearch(e.target.value); setPage(1); }} placeholder="Search by title or ID…" className={"w-full rounded-lg border py-1.5 pl-8 pr-2 text-xs focus:outline-none focus:ring-1 focus:ring-cyan-500/40 " + (theme === 'dark' ? 'bg-slate-900 border-slate-800 text-slate-200 placeholder-slate-500' : 'bg-slate-50 border-slate-200 text-slate-800 placeholder-slate-400')} />
          </div>
          <select value={statusFilter} onChange={e => { setStatusFilter(e.target.value); setPage(1); }} className={"rounded-lg border px-2 py-1.5 text-xs " + (theme === 'dark' ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700')} aria-label="Status filter">
            <option value="all">All Statuses</option>
            {['submitted', 'in-review', 'assigned', 'in-progress', 'resolved', 'closed'].map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          <select value={priorityFilter} onChange={e => { setPriorityFilter(e.target.value); setPage(1); }} className={"rounded-lg border px-2 py-1.5 text-xs " + (theme === 'dark' ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-slate-50 border-slate-200 text-slate-700')} aria-label="Priority filter">
            <option value="all">All Priorities</option>
            {['critical', 'high', 'medium', 'low'].map(p => <option key={p} value={p}>{p}</option>)}
          </select>
          <span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'} style={{ fontSize: 10 }}>{filtered.length} results</span>
        </div>

        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr className={"border-b " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
                {['ID', 'Title', 'District', 'Category', 'Priority', 'Status', 'Assigned', 'Actions'].map(h => (
                  <th key={h} className={"px-3 py-2 text-left font-medium " + (theme === 'dark' ? 'text-slate-400' : 'text-slate-500')}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {paged.map(c => (
                <tr key={c.id} className={"border-b " + (theme === 'dark' ? 'border-slate-800/60' : 'border-slate-100')}>
                  <td className={"px-3 py-2 font-mono " + (theme === 'dark' ? 'text-cyan-400' : 'text-cyan-600')} style={{ fontSize: 10 }}>{c.id}</td>
                  <td className={"px-3 py-2 font-medium " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')} style={{ maxWidth: 200, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.title}</td>
                  <td className={"px-3 py-2 " + (theme === 'dark' ? 'text-slate-400' : 'text-slate-600')}>{c.district}</td>
                  <td className={"px-3 py-2 " + (theme === 'dark' ? 'text-slate-400' : 'text-slate-600')}>{c.category}</td>
                  <td className="px-3 py-2"><Badge className={severityColor(c.priority, theme)}>{c.priority}</Badge></td>
                  <td className="px-3 py-2"><Badge className={statusColor(c.status, theme)}>{c.status}</Badge></td>
                  <td className={"px-3 py-2 " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')} style={{ fontSize: 10 }}>{c.assignedTo || '—'}</td>
                  <td className="px-3 py-2">
                    <div className="flex gap-1">
                      <button onClick={() => { setSelected(c); setAssignDept(c.assignedTo || 'Sanitation Dept'); setResolution(c.resolutionNotes || ''); }} className={"rounded p-1 " + (theme === 'dark' ? 'hover:bg-slate-700 text-slate-400' : 'hover:bg-slate-200 text-slate-600')} aria-label="View"><Icon name="eye" size={12} /></button>
                      <button onClick={() => setConfirmDelete(c.id)} className={"rounded p-1 " + (theme === 'dark' ? 'hover:bg-red-500/20 text-red-400' : 'hover:bg-red-100 text-red-600')} aria-label="Delete"><Icon name="trash" size={12} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {paged.length === 0 && <EmptyState icon={<Icon name="search" size={20} />} title="No complaints match" message="Adjust search or filters." />}
        </div>

        {totalPages > 1 && (
          <div className={"flex items-center justify-between border-t px-3 py-2 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
            <span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'} style={{ fontSize: 10 }}>Page {page} of {totalPages}</span>
            <div className="flex gap-1">
              <Button size="sm" variant="secondary" disabled={page === 1} onClick={() => setPage(p => p - 1)}>Prev</Button>
              <Button size="sm" variant="secondary" disabled={page === totalPages} onClick={() => setPage(p => p + 1)}>Next</Button>
            </div>
          </div>
        )}
      </Card>

      <Modal open={!!selected} onClose={() => setSelected(null)} title={selected ? 'Complaint ' + selected.id : ''} size="lg"
        footer={<React.Fragment>
          <Button variant="secondary" onClick={() => setSelected(null)}>Cancel</Button>
          <Button onClick={() => {
            if (selected) {
              updateComplaint(selected.id, { assignedTo: assignDept, resolutionNotes: resolution });
              pushToast({ title: 'Complaint updated', message: selected.id + ' assigned to ' + assignDept, severity: 'info' });
              setSelected(null);
            }
          }}><Icon name="check" size={14} /> Save Changes</Button>
        </React.Fragment>}>
        {selected && (
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-3 text-xs">
              <div><span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>Title: </span><span className={theme === 'dark' ? 'text-slate-200' : 'text-slate-800'}>{selected.title}</span></div>
              <div><span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>District: </span><span className={theme === 'dark' ? 'text-slate-200' : 'text-slate-800'}>{selected.district}</span></div>
              <div><span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>Category: </span><span className={theme === 'dark' ? 'text-slate-200' : 'text-slate-800'}>{selected.category}</span></div>
              <div><span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>Priority: </span><Badge className={severityColor(selected.priority, theme)}>{selected.priority}</Badge></div>
              <div><span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>Status: </span><Badge className={statusColor(selected.status, theme)}>{selected.status}</Badge></div>
              <div><span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>Created: </span><span className={theme === 'dark' ? 'text-slate-200' : 'text-slate-800'}>{new Date(selected.createdAt).toLocaleString()}</span></div>
            </div>
            <div>
              <p className={"text-xs " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')}>Description</p>
              <p className={"mt-1 rounded-lg border p-2.5 text-xs " + (theme === 'dark' ? 'border-slate-800 bg-slate-900/40 text-slate-300' : 'border-slate-200 bg-slate-50 text-slate-700')}>{selected.description}</p>
            </div>
            <Select label="Assign Department" value={assignDept} onChange={e => setAssignDept(e.target.value)}>
              {departments.map(d => <option key={d}>{d}</option>)}
            </Select>
            <Select label="Update Status" value={selected.status} onChange={e => updateComplaint(selected.id, { status: e.target.value })}>
              {['submitted', 'in-review', 'assigned', 'in-progress', 'resolved', 'closed'].map(s => <option key={s} value={s}>{s}</option>)}
            </Select>
            <Textarea label="Resolution Notes" rows={3} value={resolution} onChange={e => setResolution(e.target.value)} placeholder="Describe actions taken…" />
          </div>
        )}
      </Modal>

      <Modal open={!!confirmDelete} onClose={() => setConfirmDelete(null)} title="Confirm Deletion"
        footer={<React.Fragment>
          <Button variant="secondary" onClick={() => setConfirmDelete(null)}>Cancel</Button>
          <Button variant="danger" onClick={() => {
            if (confirmDelete) {
              pushToast({ title: 'Complaint deleted', message: confirmDelete + ' removed (demo)', severity: 'low' });
              setConfirmDelete(null);
            }
          }}>Delete</Button>
        </React.Fragment>}>
        <p className={"text-xs " + (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')}>Are you sure you want to delete complaint <strong>{confirmDelete}</strong>? This action cannot be undone.</p>
      </Modal>
    </div>
  );
};

const NotificationsPage = () => {
  const { theme, notifications, markRead, markAllRead, dismissNotification } = useApp();
  const [filter, setFilter] = useState('all');

  const filtered = notifications.filter(n => filter === 'all' || n.severity === filter || (filter === 'unread' && !n.read));

  return (
    <div className="space-y-4 p-4 md:p-6">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div>
          <Breadcrumbs />
          <h1 className={"mt-1 text-xl font-bold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>Notification Center</h1>
          <p className={"text-xs " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')}>{notifications.filter(n => !n.read).length} unread · {notifications.length} total</p>
        </div>
        <Button variant="secondary" onClick={markAllRead}><Icon name="check" size={14} /> Mark All Read</Button>
      </div>

      <div className="flex flex-wrap gap-1.5">
        {['all', 'unread', 'critical', 'high', 'medium', 'low', 'info'].map(f => (
          <button key={f} onClick={() => setFilter(f)} className={"rounded-lg border px-3 py-1.5 text-xs font-medium capitalize " + (filter === f ? (theme === 'dark' ? 'border-cyan-500/40 bg-cyan-500/10 text-cyan-400' : 'border-cyan-300 bg-cyan-50 text-cyan-700') : (theme === 'dark' ? 'border-slate-800 text-slate-400' : 'border-slate-200 text-slate-500'))}>{f}</button>
        ))}
      </div>

      <Card className="overflow-hidden">
        {filtered.length === 0 ? (
          <EmptyState icon={<Icon name="bell" size={20} />} title="No notifications" message="You're all caught up." />
        ) : filtered.map(n => (
          <div key={n.id} className={"flex items-start gap-3 border-b p-3 last:border-0 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-100')}>
            <div className={"flex h-7 w-7 shrink-0 items-center justify-center rounded-lg " + severityColor(n.severity, theme)}>
              <Icon name={n.severity === 'critical' || n.severity === 'high' ? 'alertTriangle' : n.severity === 'info' ? 'info' : 'bell'} size={12} />
            </div>
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2">
                <p className={"text-xs font-semibold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>{n.title}</p>
                {!n.read && <span className="h-1.5 w-1.5 rounded-full bg-cyan-400" />}
              </div>
              <p className={"mt-0.5 text-xs " + (theme === 'dark' ? 'text-slate-400' : 'text-slate-600')}>{n.message}</p>
              <div className="mt-1 flex items-center gap-2" style={{ fontSize: 10 }}>
                <Badge className={severityColor(n.severity, theme)}>{n.severity}</Badge>
                {n.district && <span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>{n.district}</span>}
                <span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>{n.time}</span>
              </div>
            </div>
            <div className="flex shrink-0 gap-1">
              {!n.read && <button onClick={() => markRead(n.id)} className={"rounded p-1 " + (theme === 'dark' ? 'hover:bg-slate-700 text-slate-400' : 'hover:bg-slate-200 text-slate-600')} aria-label="Mark read"><Icon name="check" size={12} /></button>}
              <button onClick={() => dismissNotification(n.id)} className={"rounded p-1 " + (theme === 'dark' ? 'hover:bg-slate-700 text-slate-400' : 'hover:bg-slate-200 text-slate-600')} aria-label="Dismiss"><Icon name="x" size={12} /></button>
            </div>
          </div>
        ))}
      </Card>
    </div>
  );
};

  const [local, setLocal] = useState(thresholds);

  useEffect(() => { setLocal(thresholds); }, [thresholds]);

  const save = () => {
    setThresholds(local);
    pushToast({ title: 'Settings saved', message: 'Alert thresholds updated', severity: 'info' });
  };

  return (
    <div className="space-y-4 p-4 md:p-6">
      <div>
        <Breadcrumbs />
        <h1 className={"mt-1 text-xl font-bold " + (theme === 'dark' ? 'text-slate-100' : 'text-slate-900')}>Settings</h1>
        <p className={"text-xs " + (theme === 'dark' ? 'text-slate-500' : 'text-slate-500')}>Configure alert thresholds and preferences</p>
      </div>

      <div className="grid grid-cols-1 gap-4 lg:grid-cols-2">
        <Card className="p-4">
          <p className={"mb-3 text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Alert Thresholds</p>
          <div className="space-y-3">
            {[['aqi', 'AQI Alert Level', 50, 300], ['traffic', 'Traffic Congestion Alert (%)', 50, 100], ['water', 'Water Reserve Low Alert (%)', 20, 80], ['power', 'Power Load Alert (MW)', 500, 1500], ['riskScore', 'Risk Score Alert', 30, 95]].map(row => (
              <div key={row[0]}>
                <div className="flex justify-between">
                  <label className={"text-xs " + (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')}>{row[1]}</label>
                  <span className="text-xs font-semibold text-cyan-400">{local[row[0]]}</span>
                </div>
                <input type="range" min={row[2]} max={row[3]} value={local[row[0]]} onChange={e => setLocal(prev => Object.assign({}, prev, { [row[0]]: Number(e.target.value) }))} className="mt-1 w-full" />
              </div>
            ))}
          </div>
          <div className="mt-4 flex gap-2">
            <Button onClick={save}><Icon name="check" size={14} /> Save Settings</Button>
            <Button variant="secondary" onClick={() => setLocal(thresholds)}>Reset</Button>
          </div>
        </Card>

        <Card className="p-4">
          <p className={"mb-3 text-xs font-semibold " + (theme === 'dark' ? 'text-slate-200' : 'text-slate-800')}>Data & Privacy</p>
          <div className={"rounded-lg border p-3 " + (theme === 'dark' ? 'border-amber-500/30 bg-amber-500/5' : 'border-amber-300 bg-amber-50')}>
            <div className="flex items-start gap-2">
              <span className="text-amber-400" style={{ marginTop: 2 }}><Icon name="info" size={14} /></span>
              <div>
                <p className={"text-xs font-semibold " + (theme === 'dark' ? 'text-amber-300' : 'text-amber-800')}>Demo Mode Active</p>
                <p className={"mt-1 " + (theme === 'dark' ? 'text-amber-200' : 'text-amber-700')} style={{ fontSize: 11 }}>This application uses simulated demonstration data only. No real sensors, government APIs, or live data feeds are connected. Complaint data is stored locally in your browser.</p>
              </div>
            </div>
          </div>
          <div className={"mt-3 rounded-lg border p-3 " + (theme === 'dark' ? 'border-slate-800' : 'border-slate-200')}>
            <p className={"text-xs font-semibold " + (theme === 'dark' ? 'text-slate-300' : 'text-slate-700')}>Storage</p>
            <div className="mt-2 space-y-1.5">
              {[['Complaints', (JSON.parse(localStorage.getItem('nexus_complaints') || '[]')).length + ' records'], ['Notifications', (JSON.parse(localStorage.getItem('nexus_notifications') || '[]')).length + ' records'], ['Theme', localStorage.getItem('nexus_theme') || 'dark']].map(row => (
                <div key={row[0]} className="flex justify-between" style={{ fontSize: 11 }}>
                  <span className={theme === 'dark' ? 'text-slate-500' : 'text-slate-500'}>{row[0]}</span>
                  <span className={theme === 'dark' ? 'text-slate-300' : 'text-slate-700'}>{row[1]}</span>
                </div>
              ))}
            </div>
            <Button size="sm" variant="danger" className="mt-3" onClick={() => {
              if (confirm('Clear all locally stored demo data?')) {
                localStorage.removeItem('nexus_complaints');
                localStorage.removeItem('nexus_notifications');
                localStorage.removeItem('nexus_thresholds');
                pushToast({ title: 'Data cleared', message: 'Reload to reset demo state', severity: 'low' });
              }
            }}><Icon name="trash" size={12} /> Clear Local Data</Button>
          </div>
        </Card>
      </div>
    </div>
  );
};

// ============================================================
// APP SHELL
// ============================================================
const AppShell = () => {
  const { theme, route } = useApp();
  const [collapsed, setCollapsed] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
  }, [theme]);

  const renderPage = () => {
    switch (route) {
      case 'dashboard': return <DashboardPage />;
      case 'map': return <MapPage />;
      case 'risk': return <RiskAnalyzerPage />;
      case 'traffic': return <TrafficPage />;
      case 'environment': return <EnvironmentPage />;
      case 'complaints': return <ComplaintsPage />;
      case 'admin': return <AdminPage />;
      case 'notifications': return <NotificationsPage />;
      case 'settings': return <SettingsPage />;
      default: return <DashboardPage />;
    }
  };

  return (
    <div className="flex h-screen overflow-hidden" style={{ backgroundColor: theme === 'dark' ? '#080D19' : '#f8fafc' }}>
      <Sidebar collapsed={collapsed} setCollapsed={setCollapsed} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
      <div className="flex min-w-0 flex-1 flex-col">
        <TopBar setMobileOpen={setMobileOpen} />
        <main className="flex-1 overflow-y-auto">{renderPage()}</main>
      </div>
      <ToastContainer />
    </div>
  );
};

const App = () => (
  <AppProvider>
    <AppShell />
  </AppProvider>
);

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
